[workspace]
# A release publishes to crates.io, tags `vX.Y.Z` and makes a GitHub
# release, marked a prerelease for a version like `0.3.0-rc.1`.
git_release_type = "auto"
# tests/api/public.txt and `!` titles track the API; a semver check would
# build nearcore twice on every push to main.
semver_check = false

# CHANGELOG.md's header explains these groups.
[changelog]
protect_breaking_commits = true
sort_commits = "oldest"
trim = false
commit_parsers = [
  { message = '^[a-z]+(\(.*\))?!:', group = "<!-- 0 -->Breaking" },
  { body = "BREAKING CHANGE", group = "<!-- 0 -->Breaking" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = ".*", skip = true },
]
body = """
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}"""
