[package]
name = "near-contract-sim"
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/near/near-contract-sim"
description = "In-process NEAR contract simulator driven by nearcore's own Runtime::apply over an in-memory trie"
readme = "README.md"
keywords = ["near", "blockchain", "testing", "simulator", "smart-contracts"]
categories = ["development-tools::testing", "cryptography::cryptocurrencies"]
# Not on crates.io yet: releases are git tags (release-plz.toml).
publish = false
# For a future crates.io package (a git dependency ignores this): the
# library, its licenses, changelog and the agent skill, whose references/
# holds the guides. Tests and fixtures stay in the repo, but for the ones
# src/'s unit tests load: every tests/res/*.wat, and probe.wasm,
# fungible_token.wasm, mtoken_events.wasm and vault.wasm.
include = [
    "/src",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-*",
    "/skills",
    "/tests/res/*.wat",
    "/tests/res/probe.wasm",
    "/tests/res/fungible_token.wasm",
    "/tests/res/mtoken_events.wasm",
    "/tests/res/vault.wasm",
]

# ---------------------------------------------------------------------------
# nearcore dependencies
#
# All nearcore crates MUST be one release, otherwise types like
# `near_primitives::receipt::Receipt` get duplicated and nothing type-checks,
# and the runtime is no longer the release's. nearcore 2.15.0-rc.1 publishes
# its crates on crates.io as 0.39.0-rc.1, from the tag's commit. Each one is
# pinned with `=`: nearcore's own requirements between its crates are carets,
# which a consumer's resolver (it doesn't read this Cargo.lock) would move to
# the next prerelease or patch.
# ---------------------------------------------------------------------------
[dependencies]
near-runtime = "=0.39.0-rc.1"
# `near_store::test_utils::TestTriesBuilder` is compiled unconditionally in
# 2.15 (no feature needed). NOTE: near-store pulls rocksdb (C++ build) even
# though we only ever use the in-memory TestDB.
near-store = "=0.39.0-rc.1"
near-primitives = "=0.39.0-rc.1"
near-parameters = "=0.39.0-rc.1"
near-crypto = { version = "=0.39.0-rc.1", features = ["rand"] }
near-vm-runner = "=0.39.0-rc.1"
# SimTransport's requests, views and errors (feature `near-kit`).
near-jsonrpc-primitives = { version = "=0.39.0-rc.1", optional = true }
# SimTransport's clock (feature `near-kit`, which enables its default
# features); the runtime's crates use it whatever the features.
near-time = { version = "=0.39.0-rc.1", default-features = false }
# Not used directly: these pin the rest of the release's crates in the
# dependency tree, the last one with feature `near-kit`.
near-async = { version = "=0.39.0-rc.1", default-features = false }
near-async-derive = { version = "=0.39.0-rc.1", default-features = false }
near-chain-configs = { version = "=0.39.0-rc.1", default-features = false }
near-chain-primitives = { version = "=0.39.0-rc.1", default-features = false }
near-config-utils = { version = "=0.39.0-rc.1", default-features = false }
near-external-storage = { version = "=0.39.0-rc.1", default-features = false }
near-fmt = { version = "=0.39.0-rc.1", default-features = false }
near-o11y = { version = "=0.39.0-rc.1", default-features = false }
near-primitives-core = { version = "=0.39.0-rc.1", default-features = false }
near-schema-checker-core = { version = "=0.39.0-rc.1", default-features = false }
near-schema-checker-lib = { version = "=0.39.0-rc.1", default-features = false }
near-schema-checker-macro = { version = "=0.39.0-rc.1", default-features = false }
near-stdx = { version = "=0.39.0-rc.1", default-features = false }
near-indexer-primitives = { version = "=0.39.0-rc.1", default-features = false, optional = true }

# `rc`: snapshots store the outcome history, which is behind `Arc`s.
borsh = { version = "1", features = ["derive", "rc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip"] }
# Compiles stubs (src/stub.wat) and the tests' WAT contracts (tests/res/*.wat).
wat = "1"
# `explore` generates plans and shrinks them with proptest.
proptest = "1.11"
# `explore` runs searches, scans and replays on a large stack of its own,
# as nested strategies recurse deeply in a debug build.
stacker = "0.1"
# `explore` reads the gas constants in a fixture's contracts, to draw gas at
# exactly those thresholds (the version nearcore's VM runner uses).
wasmparser = "0.236"
# Names a trap's function from a Rust contract's name section (src/trap.rs).
rustc-demangle = "0.1"
# `key::borsh_keccak`: near-sdk maps with the Keccak256 hasher (the version
# nearcore uses).
sha3 = "0.10"
# `ActionCosts::iter()`, to tell send fees apart in gas profiles (the
# version nearcore uses).
strum = "0.24"
# SimTransport implements near-kit's `RpcTransport`, which sits behind its
# default `rpc` feature: reqwest, which near-store already brings.
# 0.18.3 is the first near-kit whose secp256k1 signatures nodes accept.
near-kit = { version = "0.18.3", optional = true }
# The sleep of a timed-out wait.
tokio = { version = "1", features = ["time"], optional = true }

# docs.rs builds every feature, and tags what one needs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `SimTransport`: near-kit's RPC client answered in-process by a `Sim`.
near-kit = ["dep:near-kit", "dep:near-jsonrpc-primitives", "dep:near-indexer-primitives", "near-time/default", "dep:tokio"]

[dev-dependencies]
base64 = "0.22"
# The crate root's example builds the wasm with cargo-near's library.
cargo-near-build = "0.11"
# Differential test client (tests/differential/sandbox.rs).
near-kit = "0.18.3"
# `test-util`: tests run on a paused clock (`start_paused`).
tokio = { version = "1", features = ["rt", "time", "macros", "test-util"] }

# Debug info is most of the dependencies' build output; without it a shared
# compile cache can reuse rocksdb and what links it. This crate keeps its own.
[profile.dev.package."*"]
debug = false

# Every block a test runs verifies its transactions' ed25519 signatures in
# nearcore, and unoptimized that was a third of the suite's CPU (the AVX2
# field math, and sha2 under it, are thousands of tiny intrinsic calls at
# opt-level 0). Level 2 is what ci.yml already sets for every dependency, so
# CI builds are unchanged; this gives a plain local `cargo test` the same
# speed for the two crates that matter, at ~2 s of extra compile CPU. Only
# this workspace root's profiles apply: Cargo ignores the profile settings
# of a dependency's manifest, so a crate that depends on this one is unaffected.
# tests/consumer/run.sh sets the same two levels, to share this build.
[profile.dev.package.curve25519-dalek]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2
