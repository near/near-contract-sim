# The release-plz quickstart workflow (https://release-plz.dev/docs/github/quickstart),
# publishing with crates.io's trusted publishing (`id-token: write`), with the
# toolchain installed as ci.yml does (the channel that
# rust-toolchain.toml pins, not a second `stable`), and with two added
# steps: libclang for the publish's build, and CI on the release branch.
name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  release-plz-release:
    name: Release-plz release
    # A publish builds the packaged crate, nearcore with it: ci.yml's runner.
    runs-on: warp-ubuntu-2404-x64-8x
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      # As in ci.yml: librocksdb-sys runs bindgen, which needs libclang.
      - name: Install libclang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends llvm clang libclang-dev
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A push made with GITHUB_TOKEN starts no workflow, so the required
      # checks would never run on the release branch; a dispatch is the
      # exception.
      - name: Run CI on the release branch
        if: steps.release-plz.outputs.pr != '' && steps.release-plz.outputs.pr != '{}'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release-plz.outputs.pr).head_branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
