[package]
name = "drivers"
version = "0.1.0"
edition = "2021"
publish = false
description = "Drivers specimen for near-contract-sim: a pledge whose recording callback has a per-id gas budget"
repository = "https://github.com/near/near-contract-sim"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Without `funded` the contract exports only `new` and warns of unused
# imports; nothing builds it that way.
# drivers_funded.wasm: `pledge` takes issued ids and amounts, up to 64 ids,
# and refuses when their sum passes the caller's funds (`fund`).
funded = []
# drivers_capped.wasm: `funded`, and `pledge` refuses 32 ids or more.
capped = ["funded"]

[dependencies]
near-sdk = { version = "=5.29.1", features = ["unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
