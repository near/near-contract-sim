[package]
name = "fuzz-contract"
version = "0.1.0"
edition = "2021"
publish = false
description = "Programmable contract for near-contract-sim property/differential tests"
repository = "https://github.com/near/near-contract-sim"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.29.1", features = ["unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
